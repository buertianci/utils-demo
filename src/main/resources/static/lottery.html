<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炫酷抽奖系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px #fff, 0 0 30px #fff, 0 0 40px #ff00de; }
            to { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #ff00de; }
        }

        .lottery-area {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 30px;
        }

        .person-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .person-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .person-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .person-card.selected {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            animation: selectedPulse 0.5s ease-in-out;
        }

        .person-card.won {
            background: linear-gradient(45deg, #48dbfb, #0abde3);
            color: white;
            animation: wonGlow 2s ease-in-out infinite;
        }

        @keyframes selectedPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes wonGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(72, 219, 251, 0.5); }
            50% { box-shadow: 0 0 30px rgba(72, 219, 251, 0.8); }
        }

        .person-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            font-weight: bold;
        }

        .person-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .person-dept {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
        }

        .person-position {
            font-size: 0.8rem;
            color: #999;
        }

        .controls {
            text-align: center;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #48dbfb, #0abde3);
            color: white;
            box-shadow: 0 5px 15px rgba(72, 219, 251, 0.4);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(72, 219, 251, 0.6);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .winner-display {
            text-align: center;
            margin-bottom: 30px;
            min-height: 100px;
        }

        .winner-card {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            padding: 30px;
            border-radius: 20px;
            display: inline-block;
            animation: winnerAppear 0.8s ease-out;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
        }

        @keyframes winnerAppear {
            0% { 
                opacity: 0; 
                transform: scale(0.5) rotate(-180deg); 
            }
            100% { 
                opacity: 1; 
                transform: scale(1) rotate(0deg); 
            }
        }

        .winner-name {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .winner-info {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .admin-panel {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .admin-panel h3 {
            color: white;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: white;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1rem;
            color: #666;
        }

        .loading {
            display: none;
            text-align: center;
            color: white;
            font-size: 1.2rem;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #feca57;
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }


    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎉 炫酷抽奖系统 🎉</h1>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">总人数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="availableCount">0</div>
                <div class="stat-label">可抽奖人数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="wonCount">0</div>
                <div class="stat-label">已中奖人数</div>
            </div>
        </div>

        <div class="lottery-area">
            <div class="winner-display" id="winnerDisplay"></div>
            
            <div class="controls">
                <button class="btn btn-primary" id="startBtn" onclick="startLottery()">开始抽奖</button>
                <button class="btn btn-secondary" onclick="resetLottery()">重置抽奖</button>
                <button class="btn btn-secondary" onclick="toggleAdmin()">管理面板</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                正在抽奖中...
            </div>

            <div class="person-grid" id="personGrid"></div>
        </div>

        <div class="admin-panel" id="adminPanel" style="display: none;">
            <h3>📝 人员管理</h3>
            <div class="form-group">
                <label>姓名:</label>
                <input type="text" id="personName" placeholder="请输入姓名">
            </div>
            <div class="form-group">
                <label>部门:</label>
                <input type="text" id="personDept" placeholder="请输入部门">
            </div>
            <div class="form-group">
                <label>职位:</label>
                <input type="text" id="personPosition" placeholder="请输入职位">
            </div>
            <button class="btn btn-primary" onclick="addPerson()">添加人员</button>
            <button class="btn btn-secondary" onclick="addSampleData()">添加示例数据</button>
        </div>


    </div>

    <script>
        let isDrawing = false;
        let selectedPerson = null;
        let allPersons = [];
        let availablePersons = [];

        // API基础URL
        const API_BASE = '/api/lottery';

        // 页面加载时获取数据
        document.addEventListener('DOMContentLoaded', function() {
            loadPersons();
        });

        // 加载人员数据
        async function loadPersons() {
            try {
                const response = await fetch(`${API_BASE}/persons`);
                const result = await response.json();
                
                if (result.success) {
                    allPersons = result.data;
                    availablePersons = allPersons.filter(p => p.isWon === 0);
                    updateStats();
                    renderPersonGrid();
                }
            } catch (error) {
                console.error('加载数据失败:', error);
            }
        }

        // 更新统计信息
        function updateStats() {
            document.getElementById('totalCount').textContent = allPersons.length;
            document.getElementById('availableCount').textContent = availablePersons.length;
            document.getElementById('wonCount').textContent = allPersons.filter(p => p.isWon === 1).length;
        }

        // 渲染人员网格
        function renderPersonGrid() {
            const grid = document.getElementById('personGrid');
            grid.innerHTML = '';

            allPersons.forEach(person => {
                const card = document.createElement('div');
                card.className = 'person-card';
                if (person.isWon === 1) {
                    card.classList.add('won');
                }
                
                card.innerHTML = `
                    <div class="person-avatar">${person.name.charAt(0)}</div>
                    <div class="person-name">${person.name}</div>
                    <div class="person-dept">${person.department}</div>
                    <div class="person-position">${person.position}</div>
                `;

                if (person.isWon === 0) {
                    card.addEventListener('click', () => selectPerson(person, card));
                }

                grid.appendChild(card);
            });
        }

        // 选择人员
        function selectPerson(person, card) {
            if (isDrawing) return;

            // 移除之前的选择
            document.querySelectorAll('.person-card.selected').forEach(c => {
                c.classList.remove('selected');
            });

            // 添加新的选择
            card.classList.add('selected');
            selectedPerson = person;
        }

        // 开始抽奖
        async function startLottery() {
            if (isDrawing) return;

            const startBtn = document.getElementById('startBtn');
            const loading = document.getElementById('loading');

            isDrawing = true;
            startBtn.disabled = true;
            loading.style.display = 'block';

            try {
                // 模拟抽奖动画
                await simulateLotteryAnimation();

                // 执行抽奖
                const response = await fetch(`${API_BASE}/draw`, {
                    method: 'POST'
                });
                const result = await response.json();

                if (result.success) {
                    showWinner(result.data);
                    createConfetti();
                } else {
                    alert(result.message);
                }

                // 重新加载数据
                await loadPersons();

            } catch (error) {
                console.error('抽奖失败:', error);
                alert('抽奖失败，请重试');
            } finally {
                isDrawing = false;
                startBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        // 模拟抽奖动画
        async function simulateLotteryAnimation() {
            const cards = document.querySelectorAll('.person-card:not(.won)');
            const duration = 2000; // 2秒动画
            const interval = 100; // 每100ms切换一次
            const iterations = duration / interval;

            for (let i = 0; i < iterations; i++) {
                // 移除之前的高亮
                cards.forEach(card => card.classList.remove('selected'));

                // 随机选择一个卡片高亮
                const randomCard = cards[Math.floor(Math.random() * cards.length)];
                randomCard.classList.add('selected');

                await new Promise(resolve => setTimeout(resolve, interval));
            }
        }

        // 显示中奖者
        function showWinner(winner) {
            const display = document.getElementById('winnerDisplay');
            display.innerHTML = `
                <div class="winner-card">
                    <div class="winner-name">🎉 ${winner.name} 🎉</div>
                    <div class="winner-info">${winner.department} - ${winner.position}</div>
                </div>
            `;

            // 3秒后隐藏
            setTimeout(() => {
                display.innerHTML = '';
            }, 3000);
        }

        // 创建彩带效果
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDelay = Math.random() * 3 + 's';
                confetti.style.backgroundColor = ['#feca57', '#ff6b6b', '#48dbfb', '#0abde3'][Math.floor(Math.random() * 4)];
                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }

        // 重置抽奖
        async function resetLottery() {
            if (!confirm('确定要重置所有抽奖状态吗？')) return;

            try {
                const response = await fetch(`${API_BASE}/reset`, {
                    method: 'POST'
                });
                const result = await response.json();

                if (result.success) {
                    alert('重置成功');
                    await loadPersons();
                    document.getElementById('winnerDisplay').innerHTML = '';
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('重置失败:', error);
                alert('重置失败，请重试');
            }
        }

        // 切换管理面板
        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        // 添加人员
        async function addPerson() {
            const name = document.getElementById('personName').value.trim();
            const dept = document.getElementById('personDept').value.trim();
            const position = document.getElementById('personPosition').value.trim();

            if (!name || !dept || !position) {
                alert('请填写完整信息');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/person`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        department: dept,
                        position: position
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert('添加成功');
                    // 清空表单
                    document.getElementById('personName').value = '';
                    document.getElementById('personDept').value = '';
                    document.getElementById('personPosition').value = '';
                    // 重新加载数据
                    await loadPersons();
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('添加失败:', error);
                alert('添加失败，请重试');
            }
        }

        // 添加示例数据
        async function addSampleData() {
            const sampleData = [
                { name: '张三', department: '技术部', position: '高级工程师' },
                { name: '李四', department: '产品部', position: '产品经理' },
                { name: '王五', department: '设计部', position: 'UI设计师' },
                { name: '赵六', department: '运营部', position: '运营专员' },
                { name: '钱七', department: '市场部', position: '市场专员' },
                { name: '孙八', department: '人事部', position: 'HR专员' },
                { name: '周九', department: '财务部', position: '会计' },
                { name: '吴十', department: '技术部', position: '前端工程师' }
            ];

            try {
                const response = await fetch(`${API_BASE}/persons`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(sampleData)
                });

                const result = await response.json();

                if (result.success) {
                    alert('示例数据添加成功');
                    await loadPersons();
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('添加示例数据失败:', error);
                alert('添加示例数据失败，请重试');
            }
        }


    </script>
</body>
</html>
